name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned by COMMIT SHA (the tag in the comment is for humans): a tag can be moved to other code,
# a sha cannot (user ruling 2026-10-05: every user, and every CI run, gets exactly what was tested).
# tests/test_workflows.py fails on an unpinned `uses:` and on a job without timeout-minutes (a hang must be a
# red job, not a six-hour stall).

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax and shebangs
        run: |
          fail=0
          while IFS= read -r f; do
            head -n1 "$f" | grep -qE '^#!' || { echo "::error file=$f::missing shebang"; fail=1; }
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      # Hard gate on real errors only. Style-level warnings are reported but do
      # not fail the build -- the scripts predate this workflow and are clean at
      # error severity today.
      - name: shellcheck (errors block, warnings advisory)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --severity=error "${files[@]}"
          echo "--- advisory (non-blocking) ---"
          shellcheck --severity=warning "${files[@]}" || true

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Compile
        run: |
          fail=0
          while IFS= read -r f; do
            python -m py_compile "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.py')
          exit $fail

      # ruff is already a declared dev dependency in requirements.txt. Only the
      # genuine-bug rules gate the build (undefined names, syntax); the full
      # ruleset currently reports 18 style findings and runs advisory-only.
      - name: ruff
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          mapfile -t files < <(git ls-files '*.py')
          ruff check --select=E9,F63,F7,F82 "${files[@]}"
          echo "--- advisory (non-blocking) ---"
          ruff check "${files[@]}" || true

  node:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.js')
          exit $fail

      - name: npm test
        run: npm test

  toolkit:
    name: Claude Code config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: settings JSON parses
        run: |
          fail=0
          for f in .claude/settings.json .claude/settings.local.json.example .config/dotnet-tools.json package.json; do
            [ -f "$f" ] || continue
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done
          exit $fail

      - name: devcontainer.json parses
        run: |
          python - <<'PY'
          import json, re, sys, os
          f = '.devcontainer/devcontainer.json'
          if not os.path.exists(f):
              print('no devcontainer, skipping'); sys.exit(0)
          s = open(f, encoding='utf-8').read()
          # devcontainer.json is JSONC: strip comments and trailing commas first.
          s = re.sub(r'/\*.*?\*/', '', s, flags=re.S)
          s = re.sub(r'(^|\s)//[^\n]*', '', s)
          s = re.sub(r',(\s*[}\]])', r'\1', s)
          try:
              json.loads(s)
          except json.JSONDecodeError as e:
              print(f'::error file={f}::invalid JSONC: {e}'); sys.exit(1)
          print('devcontainer.json OK')
          PY

      # A hook whose script path is wrong does not error at runtime -- it silently
      # never fires. For a safety toolkit that is the worst failure mode there is.
      - name: Every hook command points at a file that exists
        run: |
          python - <<'PY'
          import json, re, sys, os
          cfg = json.load(open('.claude/settings.json'))
          missing, checked = [], 0
          for event, matchers in cfg.get('hooks', {}).items():
              for m in matchers:
                  for h in m.get('hooks', []):
                      for path in re.findall(r'\$CLAUDE_PROJECT_DIR/([^"\']+)', h.get('command', '')):
                          checked += 1
                          if not os.path.isfile(path):
                              missing.append(f'{event}: {path}')
          # Codex (Plan 4): the frozen definitions name their script after the install-root placeholder.
          codex = json.load(open('.codex/hooks.json'))
          for event, groups in codex.get('hooks', {}).items():
              for g in groups:
                  for h in g.get('hooks', []):
                      for key in ('command', 'commandWindows'):
                          paths = re.findall(r'\{\{CODEX_ROOT(?:_POSIX)?\}\}/([^"\\]+)', h.get(key, ''))
                          if not paths:
                              missing.append(f'codex {event} {key}: names no script')
                          for path in paths:
                              checked += 1
                              if not os.path.isfile(path):
                                  missing.append(f'codex {event}: {path}')
          for m in missing:
              print(f'::error::hook script not found -> {m}')
          print(f'checked {checked} hook paths')
          sys.exit(1 if missing else 0)
          PY

      # The PowerShell tool is a second way to run any command (E12). A shell hook whose matcher is plain
      # `Bash` never fires for it, silently. The file-tool hooks must stay off the shells.
      - name: Shell hooks cover the PowerShell tool
        run: |
          python - <<'PY'
          import json, re, sys
          cfg = json.load(open('.claude/settings.json'))
          seen, bad = {}, []
          for m in cfg['hooks'].get('PreToolUse', []):
              for h in m.get('hooks', []):
                  seen[h['command'].rsplit('/', 1)[-1].rstrip('"')] = m.get('matcher', '')
          for name in ('protect-bash.sh', 'snapshot-before-tool.sh'):
              rx = re.compile(seen.get(name, '(?!)'))
              if not (rx.fullmatch('Bash') and rx.fullmatch('PowerShell') and rx.fullmatch('Monitor')) or rx.fullmatch('Write'):
                  bad.append(name)
          for name in ('protect-files.sh', 'backup-before-edit.sh'):
              rx = re.compile(seen.get(name, '(?!)'))
              if rx.fullmatch('Bash') or rx.fullmatch('PowerShell') or rx.fullmatch('Monitor') or not (rx.fullmatch('Write') and rx.fullmatch('NotebookEdit')):
                  bad.append(name)
          rx = re.compile(seen.get('protect-mcp.sh', '(?!)'))
          if not rx.fullmatch('mcp__devbench-vr__console') or rx.fullmatch('Bash') or rx.fullmatch('Write'):
              bad.append('protect-mcp.sh')
          for n in bad:
              print(f'::error::hook matcher wrong for {n}: {seen.get(n)!r}')
          print(f'checked {len(seen)} PreToolUse hook matchers')
          sys.exit(1 if bad else 0)
          PY

      # A SKILL.md without name+description frontmatter is silently ignored, and a
      # name that does not match its directory never resolves.
      - name: Skill frontmatter is well-formed
        run: |
          python - <<'PY'
          import glob, os, re, sys
          fail = False
          files = sorted(glob.glob('.claude/skills/*/SKILL.md'))
          if not files:
              print('::error::no skills found'); sys.exit(1)
          for f in files:
              m = re.match(r'^---\r?\n(.*?)\r?\n---', open(f, encoding='utf-8').read(), re.S)
              if not m:
                  print(f'::error file={f}::missing YAML frontmatter'); fail = True; continue
              name = re.search(r'^name:\s*(\S+)', m.group(1), re.M)
              desc = re.search(r'^description:\s*(\S.*)', m.group(1), re.M)
              if not name:
                  print(f'::error file={f}::frontmatter missing "name"'); fail = True
              if not desc:
                  print(f'::error file={f}::frontmatter missing "description"'); fail = True
              if name:
                  want = os.path.basename(os.path.dirname(f))
                  if name.group(1) != want:
                      print(f'::error file={f}::name "{name.group(1)}" != directory "{want}"')
                      fail = True
          print(f'checked {len(files)} skills')
          sys.exit(1 if fail else 0)
          PY

      - name: Generated agent files match agent/, and the instruction budget holds (edit agent/, then run scripts/gen_agent_trees.py)
        run: python scripts/gen_agent_trees.py --check

      - name: Relative links in Markdown resolve
        run: |
          python - <<'PY'
          import glob, os, re, sys
          fail = False
          for f in glob.glob('**/*.md', recursive=True):
              base = os.path.dirname(f)
              for text, target in re.findall(r'\[([^\]]*)\]\(([^)\s]+)\)',
                                             open(f, encoding='utf-8').read()):
                  if re.match(r'^(https?:|mailto:|#)', target):
                      continue
                  path = os.path.normpath(os.path.join(base, target.split('#')[0]))
                  if path and not os.path.exists(path):
                      print(f'::error file={f}::broken link [{text}]({target})')
                      fail = True
          sys.exit(1 if fail else 0)
          PY

  setup-smoke:
    name: setup.sh runs clean
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install into a fake game directory
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq jq rsync
          GAME=/tmp/fake-skyrim
          mkdir -p "$GAME"
          # setup.sh prompts interactively if it cannot find the exe, so stub it.
          touch "$GAME/SkyrimVR.exe"
          rsync -a --exclude '.git' ./ "$GAME/"
          cd "$GAME"
          bash setup.sh < /dev/null
          test -f .claude/settings.json || { echo "::error::settings.json missing after setup"; exit 1; }
          jq empty .claude/settings.json

      - name: Running setup twice is safe
        run: |
          set -euo pipefail
          cd /tmp/fake-skyrim
          bash setup.sh < /dev/null
          jq empty .claude/settings.json

      # Running setup.sh and only checking that settings.json parses is close to
      # a false green: every path bug this toolkit has shipped would pass it.
      # These assert on what setup.sh actually WROTE. Deeper coverage lives in
      # the `behavior` job below; this keeps the smoke test honest on its own.
      - name: setup.sh wrote usable paths, not just valid JSON
        run: |
          set -euo pipefail
          cd /tmp/fake-skyrim
          leftover=$(grep -nE '\{\{[A-Z_]+\}\}' CLAUDE.md || true)
          if [ -n "$leftover" ]; then
            echo "::error::unsubstituted placeholders remain in CLAUDE.md"
            echo "$leftover"
            exit 1
          fi
          grep -q '^- \*\*Game root\*\*' CLAUDE.md \
            || { echo "::error::no Game root line written"; exit 1; }
          grep -q '^- \*\*Mod manager\*\*' CLAUDE.md \
            || { echo "::error::no Mod manager line written"; exit 1; }
          for h in .claude/hooks/*.sh; do
            if grep -q '{{PYTHON_PATH}}' "$h"; then
              echo "::error file=$h::python placeholder was never substituted"; exit 1
            fi
          done

  behavior:
    name: Behavioral tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      # OS x the TESTED Python range (user ruling 2026-10-05: setup checks 3.10-3.13, so CI runs all four).
      # Node comes from .node-version on every leg; the .NET 10 toolchain has its own job below.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # The whole suite includes tests/test_mutations.py; a leg that hangs must die red, not stall for six hours.
    timeout-minutes: 240
    # Both legs block. Windows is the platform this toolkit actually targets and
    # every path bug it has shipped was Windows-specific, so a non-blocking
    # Windows leg would be a gate that cannot fail -- the exact defect this job
    # exists to eliminate.
    defaults:
      run:
        shell: bash
    steps:
      # Full history WITH tags: the Codex hook-definition freeze gate compares against the newest release
      # tag, and fails (rather than passing vacuously) in a tagless shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately NOT python-version-file here. .python-version pins an exact
      # patch (3.11.15) for the devcontainer, and that patch has no Windows x64
      # build in the runner manifest -- the Windows leg died at setup before
      # running a single test. The matrix names the minor; the runner supplies its latest patch.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version

      # The shipped hooks no longer use jq, but the frozen bash reference hooks under
      # tests/guard_corpus/reference/ do, and the side-effect equivalence tests run them.
      - name: Ensure jq is on PATH
        run: |
          if command -v jq >/dev/null 2>&1; then jq --version; exit 0; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install jq -y --no-progress
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          command -v jq >/dev/null 2>&1 || { echo "::error::jq still missing"; exit 1; }

      - name: Install pytest
        # Block scalar: in a plain scalar, ':all: ' is a YAML mapping error that invalidates
        # the whole workflow file.
        run: |
          python -m pip install --quiet --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock

      # test_harness_controls.py and test_harness_integrations.py skip WHOLE MODULES under a
      # plain pytest: they need the package-manager barrier that only the contained launcher
      # installs. So the WHOLE suite runs through the launcher, and TOOLKIT_REQUIRE_HARNESS=1
      # makes a run without the barriers an error rather than a quiet green.
      # The live-Docker controls never pull; give the Linux leg (which has a daemon) the exact
      # sentinel image, pinned by digest, so they run there instead of reporting COULD NOT CHECK.
      - name: Live-Docker sentinel image (Linux)
        if: runner.os == 'Linux'
        run: |
          docker pull busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          docker tag busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e busybox:1.37

      # TRIPWIRE, before an hour of suite: this leg must COLLECT at least the recorded floor
      # (.github/ci-leg.json). A module that stopped importing, or a leg looking at the wrong tree, goes red here.
      - name: Tripwire -- the leg collects the whole suite
        timeout-minutes: 10
        env:
          TOOLKIT_REQUIRE_HARNESS: "1"
        run: |
          set -o pipefail
          python -B tests/run_harness_tests.py tests/ --collect-only -q | tee collect.log
          python scripts/check_ci_leg.py collect collect.log --leg "$RUNNER_OS"

      # The timing guards (catastrophic-regex, quadratic-input) and the hook deadline tests, alone and under a
      # hard step timeout: a regression there is a HANG, and a hang must be a red step, not a stalled job.
      # They run again inside the full suite; this run exists for the timeout. The opt-in CPU-load file
      # (test_hook_deadline_load.py) is NOT run in CI: a shared runner gives no stable CPU to measure against.
      - name: Timing guards and hook deadlines, under a hard timeout
        timeout-minutes: 20
        env:
          TOOLKIT_REQUIRE_HARNESS: "1"
        run: python -B tests/run_harness_tests.py tests/test_skyguard_timing.py tests/test_python_fallback.py tests/test_hook_deadline.py -q -rfEs

      - name: Behavioral suite (contained harness)
        timeout-minutes: 200
        env:
          TOOLKIT_REQUIRE_HARNESS: "1"
        run: |
          set -o pipefail
          python -B tests/run_harness_tests.py tests/ -v --durations=10 -rfEs | tee behavioral.log

      # The skip ceiling, the xfail ceiling, every required module (harness-contained ones, hook deadlines, the
      # freeze gate, the release machinery; the platform's own) has a PASSED test, and the load test did not run.
      - name: Tripwire -- skip ceiling and required modules
        if: always()
        run: python scripts/check_ci_leg.py log behavioral.log --leg "$RUNNER_OS"

      # A COULD NOT CHECK skip means a test did not run. Linux has a daemon and the sentinel image,
      # so NOTHING may be unchecked there. On Windows the Docker daemon is the one expected absence
      # (no Linux daemon on the runner) and the dir_fd skip is POSIX-only by definition. Anything
      # else going unchecked fails the job. -rfEs names failures and errors as well as skips.
      - name: No unexpected COULD NOT CHECK skips
        if: always()
        run: |
          allow=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            allow+=(--allow "Docker daemon" --allow "platform has no dir_fd removal")
          fi
          python scripts/check_could_not_check.py behavioral.log "${allow[@]}"

      # The Node tests cover path handling (game-root separators, plugins.txt
      # discovery), and the `node` job runs on Linux only -- where `path.sep`
      # is '/' and a Windows-separator bug cannot surface. Windows is the
      # platform this toolkit targets, so they run on both legs here too.
      # No `npm install` step: these tests use only the Node standard library.
      - name: Node tests
        run: npm test

  # The pinned .NET tools restore and start with the SDK the toolkit requires (10): setup-dotnet installs
  # channel 10.0 and `dotnet tool restore` resolves .config/dotnet-tools.json with it. Honest limit: hosted
  # runner images carry other .NET runtimes too, so this leg cannot prove a 10-ONLY machine works -- that is
  # T6b's net10-only spike, run locally.
  dotnet:
    name: .NET 10 toolchain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: The SDK is 10, and the pinned tools restore with it
        run: |
          set -euo pipefail
          v=$(dotnet --version)
          case "$v" in 10.*) echo "SDK $v" ;; *) echo "::error::dotnet resolves SDK $v, not 10"; exit 1 ;; esac
          dotnet tool restore
          dotnet tool list --local

  # The release machinery on every push: build the zip from the commit (scripts/build-release-zip.sh, the same
  # build release.yml runs), then verify it as a user would get it -- payload checker, leak grep, and a scrubbed
  # install (setup.sh, canary, drift check, engine selftest, every hook entry) on both platforms.
  release-build:
    name: Release build + scrubbed verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # FIRST, before any step writes into the checkout: the builder refuses a dirty tree, and CI never passes
      # --allow-dirty.
      - name: Build the zip from the commit
        run: |
          set -euo pipefail
          bash scripts/build-release-zip.sh HEAD "$RUNNER_TEMP/dist" | tee build.out
          echo "ZIP=$(sed -n 's/^ZIP=//p' build.out)" >> "$GITHUB_ENV"
          echo "COMMIT=$(sed -n 's/^COMMIT=//p' build.out)" >> "$GITHUB_ENV"
      - name: Verify the zip in a scrubbed environment
        run: bash tools/verify-release.sh --local "$ZIP" --scrubbed --expect-commit "$COMMIT"
