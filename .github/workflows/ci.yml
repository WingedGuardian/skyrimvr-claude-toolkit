name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  policy:
    name: CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_required: ${{ steps.context.outputs.full_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: WingedGuardian/modding-agent-harness/.github/actions/ci-policy@38bf2cb8da9d4add2fa3c71341d641fafd265368 # v1 policy API
        id: context
        with:
          profile: skyrim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-context
          path: ${{ runner.temp }}/ci-context.json
          if-no-files-found: error

  shell:
    needs: [policy]
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # SETUP ENDS HERE. Every step above is setup: if one fails, nothing below can mean anything and it all
      # skips (the default). Every step below is an INDEPENDENT check gated on this marker, so one red check
      # no longer silently skips the ones after it; a failed step still fails the job (X4 a0e4fd1).
      # tests/test_workflows.py::test_one_red_check_never_skips_the_later_ones enforces it.
      - name: Setup complete
        id: setup
        run: echo setup complete

      - name: Syntax and shebangs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          fail=0
          while IFS= read -r f; do
            head -n1 "$f" | grep -qE '^#!' || { echo "::error file=$f::missing shebang"; fail=1; }
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      # Hard gate on real errors only. Style-level warnings are reported but do
      # not fail the build -- the scripts predate this workflow and are clean at
      # error severity today.
      - name: shellcheck (errors block, warnings advisory)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck --severity=error "${files[@]}"
          echo "--- advisory (non-blocking) ---"
          shellcheck --severity=warning "${files[@]}" || true

  python:
    needs: [policy]
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      # SETUP ENDS HERE: every check below is gated on this marker, not on the checks before it (see the shell job).
      - name: Setup complete
        id: setup
        run: echo setup complete

      - name: Compile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          fail=0
          while IFS= read -r f; do
            python -m py_compile "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.py')
          exit $fail

      # ruff is already a declared dev dependency in requirements.txt. Only the
      # genuine-bug rules gate the build (undefined names, syntax); the full
      # ruleset runs advisory-only (its count depends on the pinned ruff: about
      # 1400 findings at 0.16.9). ruff.toml makes both runs skip the template
      # slot fragments (*.slots.py); tests/test_ruff_gate.py proves the gate still
      # goes red on a real undefined name.
      - name: ruff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          mapfile -t files < <(git ls-files '*.py')
          ruff check --select=E9,F63,F7,F82 "${files[@]}"
          echo "--- advisory (non-blocking) ---"
          ruff check "${files[@]}" || true

  node:
    needs: [policy]
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # SETUP ENDS HERE: every check below is gated on this marker, not on the checks before it (see the shell job).
      - name: Setup complete
        id: setup
        run: echo setup complete

      - name: Syntax
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.js')
          exit $fail

      # TOOLKIT_REQUIRE_NODE_DEPS=1: the FOMOD smoke (tests/fomod-xmlbuilder.test.js) must run against the
      # `npm ci` install above, never skip because node_modules is missing.
      - name: npm test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TOOLKIT_REQUIRE_NODE_DEPS: "1"
        run: npm test

      # The smoke's own control: it must go RED on fast-xml-parser 4.3.6, which lets comment/CDATA text inject
      # elements. This needs a package manager, so it lives here and not in the contained launcher's pytest run.
      - name: FOMOD smoke control (must fail on fast-xml-parser 4.3.6)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          d="$(mktemp -d)"
          cp tests/fomod-xmlbuilder.test.js "$d/"
          cd "$d"
          echo '{"name":"control","version":"1.0.0","private":true}' > package.json
          npm install --ignore-scripts --no-audit --no-fund fast-xml-parser@4.3.6
          if out="$(TOOLKIT_REQUIRE_NODE_DEPS=1 node --test fomod-xmlbuilder.test.js 2>&1)"; then
            echo "$out"; echo "::error::the FOMOD smoke passed on injectable fast-xml-parser 4.3.6: it cannot fail"; exit 1
          fi
          echo "$out" | grep -q "created an element" || { echo "$out"; echo "::error::smoke failed, but not on the injection check"; exit 1; }

  toolkit:
    needs: [policy]
    name: Claude Code config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      # SETUP ENDS HERE: every check below is gated on this marker, not on the checks before it (see the shell job).
      - name: Setup complete
        id: setup
        run: echo setup complete

      # R12 (Plan 6 Task 12): every session start hashes the guard files against GUARD-FILES.sha256 and banners the
      # ones that differ. A guard file changed without regenerating the manifest would banner on every install.
      - name: GUARD-FILES.sha256 is current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python scripts/gen-guard-hashes.py --check

      - name: settings JSON parses
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          fail=0
          for f in .claude/settings.json .claude/settings.local.json.example .config/dotnet-tools.json package.json; do
            [ -f "$f" ] || continue
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done
          exit $fail

      - name: devcontainer.json parses
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, re, sys, os
          f = '.devcontainer/devcontainer.json'
          if not os.path.exists(f):
              print('no devcontainer, skipping'); sys.exit(0)
          s = open(f, encoding='utf-8').read()
          # devcontainer.json is JSONC: strip comments and trailing commas first.
          s = re.sub(r'/\*.*?\*/', '', s, flags=re.S)
          s = re.sub(r'(^|\s)//[^\n]*', '', s)
          s = re.sub(r',(\s*[}\]])', r'\1', s)
          try:
              json.loads(s)
          except json.JSONDecodeError as e:
              print(f'::error file={f}::invalid JSONC: {e}'); sys.exit(1)
          print('devcontainer.json OK')
          PY

      # A hook whose script path is wrong does not error at runtime -- it silently
      # never fires. For a safety toolkit that is the worst failure mode there is.
      - name: Every hook command points at a file that exists
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, re, sys, os
          cfg = json.load(open('.claude/settings.json'))
          missing, checked = [], 0
          for event, matchers in cfg.get('hooks', {}).items():
              for m in matchers:
                  for h in m.get('hooks', []):
                      for path in re.findall(r'\$CLAUDE_PROJECT_DIR/([^"\']+)', h.get('command', '')):
                          checked += 1
                          if not os.path.isfile(path):
                              missing.append(f'{event}: {path}')
          # Codex (Plan 4): the frozen definitions name their script after the install-root placeholder.
          codex = json.load(open('.codex/hooks.json'))
          for event, groups in codex.get('hooks', {}).items():
              for g in groups:
                  for h in g.get('hooks', []):
                      for key in ('command', 'commandWindows'):
                          paths = re.findall(r'\{\{CODEX_ROOT(?:_POSIX)?\}\}/([^"\\]+)', h.get(key, ''))
                          if not paths:
                              missing.append(f'codex {event} {key}: names no script')
                          for path in paths:
                              checked += 1
                              if not os.path.isfile(path):
                                  missing.append(f'codex {event}: {path}')
          for m in missing:
              print(f'::error::hook script not found -> {m}')
          print(f'checked {checked} hook paths')
          sys.exit(1 if missing else 0)
          PY

      # The PowerShell tool is a second way to run any command (E12). A shell hook whose matcher is plain
      # `Bash` never fires for it, silently. The file-tool hooks must stay off the shells.
      - name: Shell hooks cover the PowerShell tool
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, re, sys
          cfg = json.load(open('.claude/settings.json'))
          seen, bad = {}, []
          for m in cfg['hooks'].get('PreToolUse', []):
              for h in m.get('hooks', []):
                  seen[h['command'].rsplit('/', 1)[-1].rstrip('"')] = m.get('matcher', '')
          for name in ('protect-bash.sh', 'snapshot-before-tool.sh'):
              rx = re.compile(seen.get(name, '(?!)'))
              if not (rx.fullmatch('Bash') and rx.fullmatch('PowerShell') and rx.fullmatch('Monitor')) or rx.fullmatch('Write'):
                  bad.append(name)
          for name in ('protect-files.sh', 'backup-before-edit.sh'):
              rx = re.compile(seen.get(name, '(?!)'))
              if rx.fullmatch('Bash') or rx.fullmatch('PowerShell') or rx.fullmatch('Monitor') or not (rx.fullmatch('Write') and rx.fullmatch('NotebookEdit')):
                  bad.append(name)
          rx = re.compile(seen.get('protect-mcp.sh', '(?!)'))
          if not rx.fullmatch('mcp__devbench-vr__console') or rx.fullmatch('Bash') or rx.fullmatch('Write'):
              bad.append('protect-mcp.sh')
          for n in bad:
              print(f'::error::hook matcher wrong for {n}: {seen.get(n)!r}')
          print(f'checked {len(seen)} PreToolUse hook matchers')
          sys.exit(1 if bad else 0)
          PY

      # A SKILL.md without name+description frontmatter is silently ignored, and a
      # name that does not match its directory never resolves.
      - name: Skill frontmatter is well-formed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python - <<'PY'
          import glob, os, re, sys
          fail = False
          files = sorted(glob.glob('.claude/skills/*/SKILL.md'))
          if not files:
              print('::error::no skills found'); sys.exit(1)
          for f in files:
              m = re.match(r'^---\r?\n(.*?)\r?\n---', open(f, encoding='utf-8').read(), re.S)
              if not m:
                  print(f'::error file={f}::missing YAML frontmatter'); fail = True; continue
              name = re.search(r'^name:\s*(\S+)', m.group(1), re.M)
              desc = re.search(r'^description:\s*(\S.*)', m.group(1), re.M)
              if not name:
                  print(f'::error file={f}::frontmatter missing "name"'); fail = True
              if not desc:
                  print(f'::error file={f}::frontmatter missing "description"'); fail = True
              if name:
                  want = os.path.basename(os.path.dirname(f))
                  if name.group(1) != want:
                      print(f'::error file={f}::name "{name.group(1)}" != directory "{want}"')
                      fail = True
          print(f'checked {len(files)} skills')
          sys.exit(1 if fail else 0)
          PY

      - name: Generated agent files match agent/, and the instruction budget holds (edit agent/, then run scripts/gen_agent_trees.py)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python scripts/gen_agent_trees.py --check

      - name: Relative links in Markdown resolve
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python - <<'PY'
          import glob, os, re, sys
          fail = False
          for f in glob.glob('**/*.md', recursive=True):
              if 'node_modules' in f.split(os.sep):
                  continue
              base = os.path.dirname(f)
              for text, target in re.findall(r'\[([^\]]*)\]\(([^)\s]+)\)',
                                             open(f, encoding='utf-8').read()):
                  if re.match(r'^(https?:|mailto:|#)', target):
                      continue
                  path = os.path.normpath(os.path.join(base, target.split('#')[0]))
                  if path and not os.path.exists(path):
                      print(f'::error file={f}::broken link [{text}]({target})')
                      fail = True
          sys.exit(1 if fail else 0)
          PY


      - uses: WingedGuardian/modding-agent-harness/.github/actions/ci-policy@38bf2cb8da9d4add2fa3c71341d641fafd265368 # v1 policy API
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          profile: skyrim
          mode: contract

  setup-smoke:
    needs: [policy]
    name: setup.sh --agent ${{ matrix.agent }} (${{ matrix.os }})
    # Every --agent value on both OSes (Plan 8 T7). scripts/setup-smoke.sh asserts on what setup.sh WROTE
    # (filled CLAUDE.md/AGENTS.md per agent, rendered or untouched .codex/hooks.json, every interpreter slot,
    # the root skyrim-paths.env, no lock without --lock), that a second run changes nothing, and that a bad
    # value exits 2 writing nothing. --agent codex on Linux must exit 3 writing nothing (Codex is Windows-only).
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        agent: [claude, codex, all, both, auto, generic, opencode]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install into a fake game folder, twice, and check what setup.sh wrote
        shell: bash
        run: bash scripts/setup-smoke.sh "${{ matrix.agent }}" "$RUNNER_TEMP/setup-smoke"

  qualification:
    name: Full qualification
    needs: [policy, shell, python, node, toolkit, setup-smoke]
    if: ${{ needs.policy.outputs.full_required == 'true' }}
    concurrency:
      group: full-qualification-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/full-qualification.yml

  required:
    name: CI required
    needs: [policy, shell, python, node, toolkit, setup-smoke, qualification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: WingedGuardian/modding-agent-harness/.github/actions/ci-policy@38bf2cb8da9d4add2fa3c71341d641fafd265368 # v1 policy API
        with:
          profile: skyrim
          mode: verify
          required-jobs: '["policy","shell","python","node","toolkit","setup-smoke","qualification"]'
          needs-json: ${{ toJSON(needs) }}
      - uses: WingedGuardian/modding-agent-harness/.github/actions/ci-policy@38bf2cb8da9d4add2fa3c71341d641fafd265368 # v1 policy API
        if: always()
        with:
          profile: skyrim
          mode: report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-qualification-evidence
          path: ${{ runner.temp }}/ci-*.json
          if-no-files-found: error
