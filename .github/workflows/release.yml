name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.5.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The zip is what users actually extract into their Skyrim folder, so it
      # must contain the dotfiles (.claude/) and nothing from git.
      - name: Build the install zip
        run: |
          set -euo pipefail
          NAME="skyrimvr-claude-toolkit-${{ steps.tag.outputs.version }}"
          mkdir -p "/tmp/$NAME"
          # tests/ is dev-only: it runs in CI from the repo and has no business
          # in the folder users extract into their Skyrim install. Note this is
          # an rsync exclude and NOT .gitattributes export-ignore -- the zip is
          # built by rsync+zip rather than `git archive`, so export-ignore would
          # be silently inert here.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' \
                --exclude '.venv' --exclude '__pycache__' --exclude '.pytest_cache' \
                ./ "/tmp/$NAME/"
          test ! -d "/tmp/$NAME/tests" || { echo "::error::tests/ leaked into the release payload"; exit 1; }
          test -d "/tmp/$NAME/.claude/hooks" || { echo "::error::.claude/ missing from payload"; exit 1; }

          # THE SHIPPED HOOKS MUST NOT BE INERT.
          #
          # `INPUT=$(cat /dev/stdin)` returns ZERO BYTES in the Claude Code hook
          # environment, while a bare `cat` returns the payload. Every hook in this
          # bundle used it and was therefore decoration for months: fired, read
          # nothing, fell through its first guard, exited 0 -- byte-identical to
          # deciding "this is fine".
          #
          # No test suite can catch this, because a suite pipes stdin and
          # /dev/stdin resolves fine there. It shipped twice. It is checked HERE,
          # against the actual payload, because that is the artifact users run --
          # the repo passing is not the same claim.
          #
          # Matches the command substitution, not the string, so the comments
          # explaining the defect do not trip it.
          nhooks=$(find "/tmp/$NAME/.claude/hooks" -name '*.sh' | wc -l)
          test "$nhooks" -ge 4 || { echo "::error::only $nhooks hook(s) in the payload; this check would be vacuous"; exit 1; }
          if grep -rn --include='*.sh' -E '\$\(cat /dev/stdin\)|< */dev/stdin' "/tmp/$NAME/.claude/hooks" | grep -vE ':[[:space:]]*#'; then
            echo "::error::a shipped hook reads stdin through /dev/stdin and is INERT in the hook environment; use a bare cat"
            exit 1
          fi
          # And each must still be able to report its own death.
          for h in "/tmp/$NAME/.claude/hooks"/*.sh; do
            grep -q 'hook-heartbeat' "$h" || { echo "::error::$(basename "$h") writes no liveness heartbeat"; exit 1; }
          done
          echo "hooks: $nhooks shipped, none inert, all writing a heartbeat"
          (cd /tmp && zip -qr "$NAME.zip" "$NAME")
          mv "/tmp/$NAME.zip" .
          unzip -l "$NAME.zip" | tail -5
          echo "ZIP=$NAME.zip" >> "$GITHUB_ENV"

      - name: Extract this version's changelog section
        run: |
          python - <<'PY' > RELEASE_NOTES.md
          import re, os
          tag = os.environ['TAG']
          version = tag.lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # Grab from the heading naming this version up to the next heading of
          # the same level. Falls back to a pointer if the section is absent.
          pattern = rf'^(#{{1,3}})\s*\[?v?{re.escape(version)}\]?.*?$(.*?)(?=^\1\s|\Z)'
          m = re.search(pattern, text, re.S | re.M)
          print(m.group(2).strip() if m else f'See CHANGELOG.md for {tag}.')
          PY
          echo "--- notes ---"; cat RELEASE_NOTES.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            "$ZIP"
