name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.5.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Without this, a workflow_dispatch run builds the zip from the DEFAULT
          # BRANCH while naming it after the input tag -- so re-cutting an old
          # release quietly ships whatever landed since. Latent until now only
          # because every release so far was push-triggered.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The zip is what users actually extract into their Skyrim folder, so it
      # must contain the dotfiles (.claude/) and nothing from git.
      - name: Build the install zip
        run: |
          set -euo pipefail
          NAME="skyrimvr-claude-toolkit-${{ steps.tag.outputs.version }}"
          mkdir -p "/tmp/$NAME"
          # tests/ is dev-only: it runs in CI from the repo and has no business
          # in the folder users extract into their Skyrim install. Note this is
          # an rsync exclude and NOT .gitattributes export-ignore -- the zip is
          # built by rsync+zip rather than `git archive`, so export-ignore would
          # be silently inert here.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' \
                --exclude '.venv' --exclude '__pycache__' --exclude '.pytest_cache' \
                ./ "/tmp/$NAME/"
          test ! -d "/tmp/$NAME/tests" || { echo "::error::tests/ leaked into the release payload"; exit 1; }
          # YOUR knowledgebase must never be IN the bundle. The update path is
          # "extract over your install", so anything shipped here overwrites the
          # user's copy -- which is the whole reason accumulation was moved out of
          # KNOWLEDGEBASE.md and into a file we do not ship. If this ever appears in
          # the payload, the split has silently stopped protecting anyone.
          test ! -e "/tmp/$NAME/KNOWLEDGEBASE.local.md" || { echo "::error::KNOWLEDGEBASE.local.md is in the release payload; extracting this release would overwrite the user's own notes"; exit 1; }
          test -f "/tmp/$NAME/KNOWLEDGEBASE.md" || { echo "::error::the toolkit's own KNOWLEDGEBASE.md is missing from the payload"; exit 1; }
          test -d "/tmp/$NAME/.claude/hooks" || { echo "::error::.claude/ missing from payload"; exit 1; }
          # setup.sh is the first thing every doc surface tells the user to run.
          test -f "/tmp/$NAME/setup.sh" || { echo "::error::setup.sh missing from the payload"; exit 1; }

          # THE SHIPPED HOOKS MUST NOT BE INERT.
          #
          # `INPUT=$(cat /dev/stdin)` returns ZERO BYTES in the Claude Code hook
          # environment, while a bare `cat` returns the payload. Every hook in this
          # bundle used it and was therefore decoration for months: fired, read
          # nothing, fell through its first guard, exited 0 -- byte-identical to
          # deciding "this is fine".
          #
          # No test suite can catch this, because a suite pipes stdin and
          # /dev/stdin resolves fine there. It shipped twice. It is checked HERE,
          # against the actual payload, because that is the artifact users run --
          # the repo passing is not the same claim.
          #
          # Matches the command substitution, not the string, so the comments
          # explaining the defect do not trip it.
          # ASSERT WHAT MUST BE TRUE, do not forbid one spelling of what must not.
          # A blocklist here passed for `cat  /dev/stdin` (two spaces), `cat /dev/fd/0`,
          # and a hook that read stdin not at all -- three more ways to be inert. The
          # positive form has no such gaps: every hook must contain the exact line that
          # works. Same for the heartbeat, which a mere `grep -q` satisfied from a
          # COMMENT mentioning it.
          nhooks=$(find "/tmp/$NAME/.claude/hooks" -name '*.sh' | wc -l)
          test "$nhooks" -ge 6 || { echo "::error::only $nhooks hook(s) in the payload; this check would be vacuous"; exit 1; }
          # find, not a glob: `for h in dir/*.sh` is non-recursive and would skip a
          # hook in a subdirectory that `nhooks` had already counted.
          while IFS= read -r h; do
            grep -qxF 'INPUT=$(cat)' "$h" \
              || { echo "::error::$(basename "$h") does not read stdin with a bare \`cat\`. /dev/stdin returns nothing when Claude Code spawns a hook, so the hook would be INERT: it fires, reads zero bytes, falls through its first guard and exits 0 -- indistinguishable from approving."; exit 1; }
            grep -qE '^[^#]*hook-heartbeat' "$h" \
              || { echo "::error::$(basename "$h") writes no liveness heartbeat outside a comment; tools/hook-canary.sh would have nothing to read"; exit 1; }
          done < <(find "/tmp/$NAME/.claude/hooks" -name '*.sh')
          # The canary is the only thing that can answer "are the hooks alive on THIS
          # install", and every doc surface tells the user to run it. Shipping the
          # references without the file is how this class of defect got here.
          test -f "/tmp/$NAME/tools/hook-canary.sh" || { echo "::error::tools/hook-canary.sh missing from the payload, but the docs tell users to run it"; exit 1; }
          # session-kb-guard.sh is deliberately thin and DELEGATES to tools/kb-guard.sh.
          # Ship the hook without the tool and every session prints "NOT RUN" -- which
          # is honest, and still means nobody's knowledgebase is being snapshotted.
          test -f "/tmp/$NAME/tools/kb-guard.sh" || { echo "::error::tools/kb-guard.sh missing from the payload; session-kb-guard.sh would report NOT RUN in every session"; exit 1; }
          # The hooks are thin wrappers over the skyguard engine. Ship them without it and every
          # blocking hook denies every call with "engine failed" -- honest, and unusable.
          test -f "/tmp/$NAME/tools/skyguard/run.py" || { echo "::error::tools/skyguard/run.py missing from the payload; every hook would report the engine failed"; exit 1; }
          echo "hooks: $nhooks shipped, all reading stdin correctly, all with a heartbeat, canary and skyguard engine present"
          # The Codex half (Plan 4): definitions parse and every script they run is here, the rules file, one
          # .agents skill per .claude skill, AGENTS.md within the size Codex reads without truncating. A piece
          # missing here does not error on a user's machine -- a Codex hook that cannot start lets the command RUN.
          python3 tools/check-codex-payload.py "/tmp/$NAME" \
            || { echo "::error::the Codex payload is incomplete (see the !! lines above)"; exit 1; }
          # The adapter kit for agents the toolkit does not wire itself: ADAPTING.md, tools/adapting/, the
          # conformance and inventory tools, the neutral engine entry, the toolkit-setup skill. Shipped by the
          # rsync rule above; asserted here so a rule change cannot drop one silently.
          python3 tools/check-adapter-payload.py "/tmp/$NAME" \
            || { echo "::error::the adapter kit is incomplete in the payload (see the !! lines above)"; exit 1; }
          (cd /tmp && zip -qr "$NAME.zip" "$NAME")
          mv "/tmp/$NAME.zip" .
          unzip -l "$NAME.zip" | tail -5
          echo "ZIP=$NAME.zip" >> "$GITHUB_ENV"

      - name: Extract this version's changelog section
        run: |
          python - <<'PY' > RELEASE_NOTES.md
          import re, os
          tag = os.environ['TAG']
          version = tag.lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # Grab from the heading naming this version up to the next heading of
          # the same level. Falls back to a pointer if the section is absent.
          pattern = rf'^(#{{1,3}})\s*\[?v?{re.escape(version)}\]?.*?$(.*?)(?=^\1\s|\Z)'
          m = re.search(pattern, text, re.S | re.M)
          print(m.group(2).strip() if m else f'See CHANGELOG.md for {tag}.')
          PY
          echo "--- notes ---"; cat RELEASE_NOTES.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            "$ZIP"
