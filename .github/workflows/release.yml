name: Release

# Runs ONLY on a tag the user pushed, or on a tag the user names by hand (workflow_dispatch). Nothing here
# creates, moves or pushes a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.0.0)'
        required: true

# Least privilege: read by default; only the job that publishes gets write.
permissions:
  contents: read

# One release run per tag at a time; never cancel one half-way through publishing.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Actions are pinned by COMMIT SHA (tests/test_workflows.py fails on a tag reference). User inputs never appear
# inside a `run:` script as ${{ }}: they reach the shell through env, so a crafted tag name is data, not code.

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags: the master-ancestry check below and the Codex freeze gate both need them.
          fetch-depth: 0
          persist-credentials: false
          # Without this, a workflow_dispatch run builds the zip from the DEFAULT
          # BRANCH while naming it after the input tag -- so re-cutting an old
          # release quietly ships whatever landed since.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve and validate the tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1; }
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}") || { echo "::error::no tag $TAG in this checkout"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # WORKFLOW SAFETY. The checkout is the tag's commit, that commit is on master (a tag on a side branch
      # would publish code nobody merged), and the CHANGELOG has a section for this version.
      - name: Workflow safety -- the tag's commit is checked out, is on master, and has a CHANGELOG section
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::HEAD is not $TAG's commit $SHA"; exit 1; }
          git rev-parse --verify --quiet refs/remotes/origin/master >/dev/null \
            || { echo "::error::origin/master is not in this checkout (fetch-depth: 0 lost?)"; exit 1; }
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/master \
            || { echo "::error::$TAG ($SHA) is not on master; refusing to publish an unmerged commit"; exit 1; }
          VER_RE=$(printf '%s' "${TAG#v}" | sed 's/[.]/[.]/g')
          grep -qE "^#{1,3} +\[?v?${VER_RE}\]?([^0-9.]|$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }
          echo "$TAG = $SHA, on master, CHANGELOG section present"

      # The zip is built from the tag's COMMITTED objects (never the checkout), and FIRST: nothing has written
      # into the checkout yet, so the builder's dirty-tree tripwire is live (CI never passes --allow-dirty).
      - name: Build the install zip from the tag's commit
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-release-zip.sh "$SHA" "$RUNNER_TEMP/dist" --version "$VERSION" | tee "$RUNNER_TEMP/build.out"
          ZIP=$(sed -n 's/^ZIP=//p' "$RUNNER_TEMP/build.out")
          [ "$(sed -n 's/^COMMIT=//p' "$RUNNER_TEMP/build.out")" = "$SHA" ] || { echo "::error::built a different commit"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # The Codex hook-definition freeze gate. Its baseline is the newest release tag OTHER than this one that
      # carries the definitions; for the first such release (v4.0.0) there is none, and FROZEN.sha256 decides.
      - name: Codex hook definitions are frozen (vs the last release, or FROZEN.sha256)
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -B -m pytest -p no:cacheprovider -q tests/test_codex_definitions.py -k "frozen or freeze"

      # ONE checker for both gates: payload shape, the hook floor, the Codex half, the adapter kit,
      # tests/fixtures/routes-harness/ absent, BUILD-INFO = the tag's commit, the leak grep, and a scrubbed install.
      # The runner's own account is `runner`, which says nothing about the maintainer: the identity to grep for
      # (name and home/game paths, newline-separated) comes from the repository secret LEAK_TOKENS, and an empty
      # or absent secret FAILS this step (VERIFY_REQUIRE_LEAK_TOKENS=1). See README "Releasing (maintainer)".
      - name: Verify the zip as a user gets it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          LEAK_TOKENS: ${{ secrets.LEAK_TOKENS }}
          VERIFY_REQUIRE_LEAK_TOKENS: "1"
        run: bash tools/verify-release.sh --local "$ZIP" --scrubbed --expect-commit "$SHA" --tag "$TAG"

      - name: Extract this version's changelog section
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/RELEASE_NOTES.md"
          import re, os
          tag = os.environ['TAG']
          version = tag.lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # Grab from the heading naming this version up to the next heading of
          # the same level. The safety step above already proved the section exists.
          pattern = rf'^(#{{1,3}})\s*\[?v?{re.escape(version)}\]?.*?$(.*?)(?=^\1\s|\Z)'
          m = re.search(pattern, text, re.S | re.M)
          print(m.group(2).strip() if m else f'See CHANGELOG.md for {tag}.')
          PY
          echo "--- notes ---"; cat "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            "$ZIP"
